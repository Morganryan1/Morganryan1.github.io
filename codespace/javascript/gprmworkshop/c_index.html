<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>GPRM Workshop 2021</title>

  <!-- Leaflet Core -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- MarkerCluster Plugin -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

  <!-- Custom Data -->
  <script src="https://morganryan2019.github.io/GPRMWorkshop/POIdata.js"></script>
  <script src="https://morganryan2019.github.io/GPRMWorkshop/RegionData.js"></script>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
    }

    #map {
      height: 100%;
      width: 100%;
    }

    .legend {
      background: white;
      padding: 6px 10px;
      line-height: 18px;
      border-radius: 6px;
      box-shadow: 0 0 8px rgba(0, 0, 0, 0.2);
      font-size: 13px;
      opacity: 0.9;
    }

    .legend i {
      width: 18px;
      height: 18px;
      float: left;
      margin-right: 8px;
      opacity: 0.8;
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script>
    // ============================================================
    //  GPRM WORKSHOP DEMO MAP
    // ============================================================

    var map = L.map("map", {
      center: [41.5, -99.9],
      zoom: 6
    });

    // Base layer
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution:
        'Workshop demo by <a href="https://github.com/MorganRyan1">Morgan Ryan</a> | ' +
        "© <a href='https://openstreetmap.org'>OpenStreetMap</a> contributors"
    }).addTo(map);

    // ============================================================
    //  Region Styling (matches legend)
    // ============================================================

    function getColor(region) {
      switch (region) {
        case "NE": return "#845A94"; // Northeast
        case "SE": return "#DA4167"; // Southeast
        case "NC": return "#00A6A6"; // North Central
        case "SC": return "#F9C80E"; // South Central
        case "Pan": return "#F86624"; // Panhandle
        default: return "#999999";
      }
    }

    function style(feature) {
      return {
        fillColor: getColor(feature.properties.Location),
        weight: 1.5,
        opacity: 1,
        color: "#333",       // darker border for contrast
        dashArray: "3",
        fillOpacity: 0.65    // slight transparency for basemap visibility
      };
    }

    // ============================================================
    //  Load Region Data
    // ============================================================
    var regionLayer;
    if (typeof RegionData !== "undefined") {
      regionLayer = L.geoJson(RegionData, {
        style: style,
        onEachFeature: function (feature, layer) {
          var props = feature.properties || {};
          layer.bindPopup(
            "<b>County:</b> " + (props.NAMELSAD10 || "Unknown") +
            "<br/><b>Region:</b> " + (props.Location || "N/A")
          );
        }
      }).addTo(map);
    } else {
      console.error("⚠️ RegionData.js not found or invalid.");
    }

    // ============================================================
    //  Load POI Data (Points)
    // ============================================================
    if (typeof POIdata !== "undefined") {
      var poiLayer = L.geoJson(POIdata, {
        pointToLayer: function (feature, latlng) {
          return L.marker(latlng);
        },
        onEachFeature: function (feature, layer) {
          var props = feature.properties || {};
          layer.bindPopup(
            "<b>Name:</b> " + (props.name || "Unknown") +
            "<br/><hr/><b>Feature Class:</b> " + (props.fclass || "None")
          );
        }
      });

      var clusterGroup = L.markerClusterGroup();
      clusterGroup.addLayer(poiLayer);
      map.addLayer(clusterGroup);
    } else {
      console.error("⚠️ POIdata.js not found or invalid.");
    }

    // ============================================================
    //  Legend
    // ============================================================
    var legend = L.control({ position: "bottomright" });

    legend.onAdd = function () {
      var div = L.DomUtil.create("div", "legend");
      var regions = ["NE", "SE", "NC", "SC", "Pan"];

      div.innerHTML += "<b>Regions</b><br/>";
      for (var i = 0; i < regions.length; i++) {
        div.innerHTML +=
          '<i style="background:' + getColor(regions[i]) + '"></i> ' +
          regions[i] + "<br/>";
      }
      return div;
    };
    legend.addTo(map);

    // ============================================================
    //  Layer Control & Scale
    // ============================================================
    var overlays = {};
    if (typeof regionLayer !== "undefined") overlays["Regions"] = regionLayer;
    if (typeof clusterGroup !== "undefined") overlays["Points of Interest"] = clusterGroup;

    L.control.layers(null, overlays, { collapsed: false }).addTo(map);
    L.control.scale({ position: "bottomleft" }).addTo(map);
  </script>
</body>
</html>
