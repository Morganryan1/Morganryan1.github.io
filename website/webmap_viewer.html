<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Web Map + Code Viewer</title>

<!-- Highlight.js -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark-dimmed.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/html.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/javascript.min.js"></script>

<style>
  :root {
    --bg-color: #0d1117;
    --text-color: #e6edf3;
    --accent: #58a6ff;
    --border-color: #1f2937;
  }

  body {
    margin: 0;
    height: 100vh;
    display: grid;
    grid-template-columns: 65% 35%; /* ✅ Expanded code panel */
    overflow: hidden;
    background-color: var(--bg-color);
    color: var(--text-color);
    font-family: "Segoe UI", sans-serif;
  }

  /* Left: Code panel */
  #codePanel {
    display: flex;
    flex-direction: column;
    background: var(--bg-color);
    padding: 50px 70px;
    border-right: 2px solid var(--border-color);
    overflow-y: auto;
  }

  /* Custom scrollbar for code panel */
  #codePanel::-webkit-scrollbar {
    width: 10px;
  }
  #codePanel::-webkit-scrollbar-thumb {
    background-color: #30363d;
    border-radius: 10px;
  }
  #codePanel::-webkit-scrollbar-track {
    background-color: #0d1117;
  }

  #backLink {
    color: var(--accent);
    text-decoration: none;
    font-weight: 500;
    font-size: 15px;
    margin-bottom: 25px;
  }
  #backLink:hover { text-decoration: underline; }

  h1 {
    color: var(--accent);
    font-size: 28px;
    font-weight: 600;
    margin: 10px 0 25px 0;
    text-transform: capitalize;
  }

  pre {
    background: #161b22;
    border-radius: 6px;
    padding: 25px 30px;
    font-size: 14px;
    overflow-x: auto;
    overflow-wrap: anywhere;
    white-space: pre-wrap;
    word-break: break-word;
    line-height: 1.55em;
  }

  code {
    font-family: "Fira Code", monospace;
    white-space: pre-wrap;
  }

  /* Right: Map panel */
  #mapPanel {
    background: #f5f5f5;
  }

  #mapPanel iframe {
    width: 100%;
    height: 100%;
    border: none;
  }
</style>
</head>

<body>
  <div id="codePanel">
    <a href="../website/index.html" id="backLink">← Back to Website</a>
    <h1 id="fileTitle">Loading...</h1>
    <pre><code id="codeBlock" class="language-html">Loading code...</code></pre>
  </div>

  <div id="mapPanel">
    <iframe id="mapFrame"></iframe>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const srcUrl = params.get("src");

    const codeBlock = document.getElementById("codeBlock");
    const mapFrame = document.getElementById("mapFrame");
    const fileTitle = document.getElementById("fileTitle");

    if (!srcUrl) {
      fileTitle.textContent = "No Source URL";
      codeBlock.textContent = "⚠️ No 'src' parameter provided.\nExample:\nwebmap_viewer.html?src=https://raw.githubusercontent.com/Morganryan1/Morganryan1.github.io/main/webmaps/foodbank/index.html";
    } else {
      // Extract directory name instead of file name
      const parts = srcUrl.split("/");
      const directoryName = parts[parts.length - 2]; // second to last part
      fileTitle.textContent = directoryName;

      fetch(srcUrl)
        .then(res => res.text())
        .then(text => {
          codeBlock.textContent = text;
          hljs.highlightElement(codeBlock);
          mapFrame.srcdoc = text;
        })
        .catch(err => {
          codeBlock.textContent = "❌ Failed to load file:\n" + err;
        });
    }
  </script>
</body>
</html>
